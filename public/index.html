<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa de ayuda</title>
    <!-- Tailwind por CDN: hace falta internet para que carguen los estilos -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="app.js" defer></script>
  </head>
  <!--
  Esta página todavía no tiene ninguna clase de Tailwind, por eso se ve
  tan plana. Darle forma es el nivel 0 del enunciado.
  Puedes añadir clases y contenedores, pero no cambies los id: app.js
  depende de ellos.
-->
  <body>
    <header class="bg-green-700 text-white">
      <div class="max-w-6xl mx-auto px-4 py-5">
        <h1 class="text-3xl font-bold">Mesa de ayuda</h1>
        <p class="text-green-100">Tickets de soporte de la oficina</p>
      </div>
    </header>

    <main
      class="max-w-6xl mx-auto px-4 py-6 grid gap-6 lg:grid-cols-3 lg:items-start"
    >
      <!-- Formulario: crea tickets y, desde el nivel 4, también los edita -->
      <section
        class="min-w-0 border border-gray-300 bg-green-50 p-4 lg:col-span-1"
      >
        <h2
          id="titulo-formulario"
          class="text-xl font-bold text-green-800 border-b border-green-700 pb-2 mb-4"
        >
          Nuevo ticket
        </h2>

        <form id="form-ticket" novalidate class="space-y-4">
          <div>
            <label for="titulo" class="block text-sm font-medium mb-1"
              >Título</label
            >
            <input
              id="titulo"
              name="titulo"
              type="text"
              class="w-full border border-gray-400 bg-white px-3 py-2 focus:outline-none focus:border-green-700 focus:ring-2 focus:ring-green-600"
            />
            <p id="error-titulo" class="text-sm text-red-700"></p>
          </div>

          <div>
            <label for="descripcion" class="block text-sm font-medium mb-1"
              >Descripción</label
            >
            <textarea
              id="descripcion"
              name="descripcion"
              rows="3"
              class="w-full border border-gray-400 bg-white px-3 py-2 focus:outline-none focus:border-green-700 focus:ring-2 focus:ring-green-600"
            ></textarea>
          </div>

          <div>
            <label for="solicitante" class="block text-sm font-medium mb-1"
              >Solicitante</label
            >
            <input
              id="solicitante"
              name="solicitante"
              type="text"
              class="w-full border border-gray-400 bg-white px-3 py-2 focus:outline-none focus:border-green-700 focus:ring-2 focus:ring-green-600"
            />
            <p id="error-solicitante" class="text-sm text-red-700"></p>
          </div>

          <div>
            <label for="categoria" class="block text-sm font-medium mb-1"
              >Categoría</label
            >
            <select
              id="categoria"
              name="categoria"
              class="w-full border border-gray-400 bg-white px-3 py-2 focus:outline-none focus:border-green-700 focus:ring-2 focus:ring-green-600"
            >
              <option value="hardware">Hardware</option>
              <option value="software">Software</option>
              <option value="red">Red</option>
              <option value="accesos">Accesos</option>
            </select>
          </div>

          <div>
            <label for="prioridad" class="block text-sm font-medium mb-1"
              >Prioridad</label
            >
            <select
              id="prioridad"
              name="prioridad"
              class="w-full border border-gray-400 bg-white px-3 py-2 focus:outline-none focus:border-green-700 focus:ring-2 focus:ring-green-600"
            >
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
          </div>

          <div class="flex flex-col gap-2 sm:flex-row lg:flex-col xl:flex-row">
            <button
              id="btn-guardar"
              type="submit"
              class="bg-green-700 text-white font-medium px-4 py-2 hover:bg-green-900 focus:outline-none focus:ring-2 focus:ring-green-600 focus:ring-offset-2"
            >
              Crear ticket
            </button>
            <button
              id="btn-cancelar"
              type="button"
              hidden
              class="bg-white text-green-800 font-medium border border-green-700 px-4 py-2 hover:bg-green-100 focus:outline-none focus:ring-2 focus:ring-green-600 focus:ring-offset-2"
            >
              Cancelar edición
            </button>
          </div>
        </form>
      </section>

      <!-- Tablero -->
      <section class="min-w-0 border border-gray-300 bg-green-50 p-4 lg:col-span-2">
        <h2
          class="text-xl font-bold text-green-800 border-b border-green-700 pb-2 mb-4"
        >
          Tickets
        </h2>

        <div id="resumen" class="mb-4 text-sm"></div>

        <div class="flex flex-col gap-4 mb-4 md:flex-row md:items-end">
          <div class="md:w-1/3">
            <label for="filtro-estado" class="block text-sm font-medium mb-1"
              >Estado</label
            >
            <select
              id="filtro-estado"
              class="w-full border border-gray-400 bg-white px-3 py-2 focus:outline-none focus:border-green-700 focus:ring-2 focus:ring-green-600"
            >
              <option value="todos">Todos</option>
              <option value="abierto">Abiertos</option>
              <option value="en_progreso">En progreso</option>
              <option value="resuelto">Resueltos</option>
            </select>
          </div>

          <div class="md:flex-1">
            <label for="busqueda" class="block text-sm font-medium mb-1"
              >Buscar</label
            >
            <input
              id="busqueda"
              type="search"
              placeholder="Buscar por título"
              class="w-full border border-gray-400 bg-white px-3 py-2 focus:outline-none focus:border-green-700 focus:ring-2 focus:ring-green-600"
            />
          </div>
        </div>

        <p id="mensaje" class="text-sm text-gray-700 mb-2"></p>

        <div id="lista-tickets" class="grid gap-3 md:grid-cols-2"></div>
      </section>
    </main>
  </body>
</html>
